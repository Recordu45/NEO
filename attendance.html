<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050811">
<title>NEO | Attendance Calculator</title>
<link rel="stylesheet" href="style.css">

<style>
.attendance-page{width:min(900px,100%);margin:auto;padding:25px 18px 110px}
.header{padding:30px 0}
.back-btn{border:1px solid rgba(80,180,255,.18);background:rgba(13,21,38,.78);color:white;padding:11px 15px;border-radius:12px;margin-bottom:25px;cursor:pointer}
.header h1{font-size:clamp(38px,8vw,62px);margin-top:12px}
.header h1 span{color:#28c7ff}
.header p{color:#8e9bb2;line-height:1.6;margin-top:12px}
.card{padding:24px;background:linear-gradient(135deg,rgba(18,31,54,.95),rgba(8,13,25,.95));border:1px solid rgba(80,180,255,.18);border-radius:22px;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.group label{display:block;margin-bottom:7px;color:#cbd5e5;font-size:13px}
.group input{width:100%;padding:13px 14px;border:1px solid rgba(80,180,255,.18);border-radius:12px;outline:none;background:rgba(0,0,0,.25);color:white;font-size:14px}
.btn{padding:11px 16px;border:1px solid rgba(80,180,255,.2);border-radius:10px;background:rgba(40,199,255,.08);color:#28c7ff;cursor:pointer}
.btn.primary{background:#28c7ff;color:#00121a;border-color:#28c7ff;font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.result{text-align:center}
.percent{font-size:64px;font-weight:800;color:#28c7ff}
.status{margin-top:10px;font-size:14px}
.status.good{color:#42e6a4}.status.warning{color:#ffd27a}.status.bad{color:#ff8d8d}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.info{padding:18px;background:rgba(13,21,38,.78);border:1px solid rgba(80,180,255,.16);border-radius:17px}
.info span{display:block;color:#8e9bb2;font-size:11px}.info strong{display:block;margin-top:8px;color:#28c7ff;font-size:22px}
.progress{height:12px;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden;margin-top:20px}.progress span{display:block;height:100%;width:0;background:#28c7ff;border-radius:20px;transition:.3s}
.history{display:grid;gap:10px}.history-item{padding:15px;background:rgba(13,21,38,.7);border:1px solid rgba(80,180,255,.14);border-radius:14px;color:#cbd5e5}.history-item small{color:#8e9bb2}
.empty{text-align:center;color:#64748b;padding:25px}
@media(max-width:650px){.form-grid,.info-grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="attendance-page">

<header class="header">
<button class="back-btn" onclick="goBack()">← Back to Student Mode</button>
<span class="eyebrow">NEO STUDENT TOOL</span>
<h1>Attendance <span>Calculator</span></h1>
<p>Calculate attendance percentage and find how many classes you need to attend to reach your target.</p>
</header>

<section class="card">
<h2>Calculate Attendance</h2><br>

<div class="form-grid">

<div class="group">
<label>Total Classes Held</label>
<input id="total" type="number" min="0" placeholder="Example: 100">
</div>

<div class="group">
<label>Classes Attended</label>
<input id="attended" type="number" min="0" placeholder="Example: 78">
</div>

<div class="group">
<label>Target Attendance %</label>
<input id="target" type="number" min="1" max="100" value="75">
</div>

</div>

<div class="actions">
<button class="btn primary" onclick="calculate()">Calculate</button>
<button class="btn" onclick="clearForm()">Clear</button>
</div>
</section>

<section id="resultCard" class="card result" style="display:none">

<div class="percent" id="percentage">0%</div>

<div id="status" class="status">
Attendance status
</div>

<div class="progress">
<span id="progressBar"></span>
</div>

<div class="info-grid">

<div class="info">
<span>Classes Held</span>
<strong id="heldValue">0</strong>
</div>

<div class="info">
<span>Attended</span>
<strong id="attendedValue">0</strong>
</div>

<div class="info">
<span>Absent</span>
<strong id="absentValue">0</strong>
</div>

<div class="info">
<span>Target</span>
<strong id="targetValue">75%</strong>
</div>

<div class="info">
<span>Classes Needed</span>
<strong id="neededValue">0</strong>
</div>

<div class="info">
<span>Can Miss</span>
<strong id="missValue">0</strong>
</div>

</div>

</section>

<section class="card">
<h2>Calculation History</h2><br>
<div id="history" class="history"></div>

<div class="actions">
<button class="btn" onclick="clearHistory()">Clear History</button>
</div>
</section>

</div>

<script>
const STORAGE_KEY="neo_attendance_history";

function calculate(){
    const total=Number(document.getElementById("total").value);
    const attended=Number(document.getElementById("attended").value);
    const target=Number(document.getElementById("target").value);

    if(total<=0){
        alert("Please enter total classes.");
        return;
    }

    if(attended<0 || attended>total){
        alert("Attended classes must be between 0 and total classes.");
        return;
    }

    if(target<=0 || target>100){
        alert("Target must be between 1 and 100.");
        return;
    }

    const percentage=(attended/total)*100;
    const absent=total-attended;

    let needed=0;

    if(percentage<target && target<100){
        needed=Math.ceil((target*total-attended)/(100-target));
    }

    let canMiss=0;

    if(percentage>=target && target>0){
        canMiss=Math.floor(
            (attended*100/target)-total
        );
        if(canMiss<0) canMiss=0;
    }

    document.getElementById("resultCard").style.display="block";
    document.getElementById("percentage").textContent=percentage.toFixed(2)+"%";
    document.getElementById("heldValue").textContent=total;
    document.getElementById("attendedValue").textContent=attended;
    document.getElementById("absentValue").textContent=absent;
    document.getElementById("targetValue").textContent=target+"%";
    document.getElementById("neededValue").textContent=needed;
    document.getElementById("missValue").textContent=canMiss;
    document.getElementById("progressBar").style.width=Math.min(percentage,100)+"%";

    const status=document.getElementById("status");
    status.className="status";

    if(percentage>=target){
        status.classList.add("good");
        status.textContent="You are meeting your target attendance.";
    }else{
        status.classList.add("warning");
        status.textContent="You are below your target. Attend "+needed+" consecutive classes to reach it.";
    }

    saveHistory({
        total,
        attended,
        target,
        percentage,
        date:new Date().toLocaleString("en-IN")
    });
}

function saveHistory(item){
    const history=getHistory();
    history.unshift(item);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(0,20)));
    renderHistory();
}

function getHistory(){
    try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
    }catch{
        return [];
    }
}

function renderHistory(){
    const history=getHistory();
    const box=document.getElementById("history");

    if(!history.length){
        box.innerHTML='<div class="empty">No calculations saved yet.</div>';
        return;
    }

    box.innerHTML=history.map(item=>`
        <div class="history-item">
            <strong>${item.percentage.toFixed(2)}%</strong>
            • ${item.attended}/${item.total} attended
            • Target ${item.target}%
            <br>
            <small>${item.date}</small>
        </div>
    `).join("");
}

function clearHistory(){
    if(!confirm("Clear attendance history?")) return;
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
}

function clearForm(){
    document.getElementById("total").value="";
    document.getElementById("attended").value="";
    document.getElementById("target").value="75";
    document.getElementById("resultCard").style.display="none";
}

function goBack(){
    window.location.href="student.html";
}

renderHistory();
</script>
</body>
</html>
