<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050811"
    >

    <title>NEO | DPD Calculator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .dpd-page {
            width: min(850px, 100%);
            margin: auto;
            padding: 25px 18px 110px;
        }

        .dpd-header {
            padding: 30px 0;
        }

        .back-btn {
            border: 1px solid rgba(80,180,255,.18);
            background: rgba(13,21,38,.78);
            color: white;
            padding: 11px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .dpd-header h1 {
            font-size: clamp(38px, 8vw, 62px);
            margin-top: 12px;
        }

        .dpd-header h1 span {
            color: #28c7ff;
        }

        .dpd-header p {
            color: #8e9bb2;
            line-height: 1.6;
            margin-top: 12px;
        }

        .calculator-card {
            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(18,31,54,.95),
                    rgba(8,13,25,.95)
                );

            border:
                1px solid
                rgba(80,180,255,.18);

            border-radius: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e5;
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            height: 52px;
            padding: 0 15px;

            border:
                1px solid
                rgba(80,180,255,.18);

            border-radius: 13px;

            outline: none;

            background:
                rgba(0,0,0,.25);

            color: white;

            font-size: 16px;
        }

        .input-group input:focus {
            border-color: #28c7ff;
        }

        .calculate-btn {
            width: 100%;
            height: 52px;
            margin-top: 5px;

            border: 0;

            border-radius: 13px;

            background: #28c7ff;

            color: #00121a;

            font-weight: 800;

            font-size: 16px;

            cursor: pointer;
        }

        .result {
            display: none;
            margin-top: 20px;
        }

        .result.active {
            display: block;
        }

        .main-result {
            padding: 25px;

            text-align: center;

            background:
                rgba(40,199,255,.08);

            border:
                1px solid
                rgba(40,199,255,.2);

            border-radius: 20px;
        }

        .main-result span {
            color: #8e9bb2;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .main-result h2 {
            margin-top: 10px;
            font-size: 42px;
            color: #28c7ff;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #8e9bb2;
        }

        .error {
            display: none;

            margin-top: 15px;
            padding: 12px;

            color: #ff9b9b;

            background:
                rgba(255,70,70,.08);

            border:
                1px solid
                rgba(255,70,70,.15);

            border-radius: 12px;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="dpd-page">


    <!-- HEADER -->

    <header class="dpd-header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Banker Mode
        </button>


        <span class="eyebrow">
            NEO BANKER TOOL
        </span>


        <h1>
            DPD <span>Calculator</span>
        </h1>


        <p>
            Calculate the number of days between
            a due date and a calculation date.
        </p>

    </header>


    <!-- CALCULATOR -->

    <section class="calculator-card">


        <div class="input-group">

            <label for="dueDate">
                Due Date
            </label>

            <input
                id="dueDate"
                type="date"
            >

        </div>


        <div class="input-group">

            <label for="calculationDate">
                Calculation Date
            </label>

            <input
                id="calculationDate"
                type="date"
            >

        </div>


        <button
            class="calculate-btn"
            onclick="calculateDPD()"
        >
            Calculate DPD
        </button>


        <div
            id="error"
            class="error"
        ></div>


        <div
            id="result"
            class="result"
        >

            <div class="main-result">

                <span>
                    DAYS PAST DUE
                </span>

                <h2 id="dpdValue">
                    0
                </h2>

                <div
                    id="status"
                    class="status"
                ></div>

            </div>

        </div>

    </section>

</div>


<script>


    /* ==============================
       DEFAULT DATE
    ============================== */

    function setToday() {

        const today =
            new Date();


        const year =
            today.getFullYear();


        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                today.getDate()
            ).padStart(2, "0");


        const todayString =
            `${year}-${month}-${day}`;


        document.getElementById(
            "calculationDate"
        ).value =
            todayString;

    }


    /* ==============================
       CALCULATE DPD
    ============================== */

    function calculateDPD() {

        const dueInput =
            document.getElementById(
                "dueDate"
            );


        const calcInput =
            document.getElementById(
                "calculationDate"
            );


        const error =
            document.getElementById(
                "error"
            );


        const result =
            document.getElementById(
                "result"
            );


        const dpdValue =
            document.getElementById(
                "dpdValue"
            );


        const status =
            document.getElementById(
                "status"
            );


        error.style.display =
            "none";


        result.classList.remove(
            "active"
        );


        if (
            !dueInput.value ||
            !calcInput.value
        ) {

            showError(
                "Please select both dates."
            );

            return;

        }


        const dueDate =
            new Date(
                dueInput.value +
                "T00:00:00"
            );


        const calcDate =
            new Date(
                calcInput.value +
                "T00:00:00"
            );


        const difference =
            Math.floor(
                (
                    calcDate - dueDate
                ) /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            );


        let dpd;


        if (difference > 0) {

            dpd =
                difference;

            status.textContent =
                "Account is overdue by " +
                difference +
                " day(s).";

        } else if (difference === 0) {

            dpd = 0;

            status.textContent =
                "Due date is today.";

        } else {

            dpd = 0;

            status.textContent =
                "Due date has not arrived yet. " +
                Math.abs(difference) +
                " day(s) remaining.";

        }


        dpdValue.textContent =
            dpd;


        result.classList.add(
            "active"
        );

    }


    /* ==============================
       ERROR
    ============================== */

    function showError(message) {

        const error =
            document.getElementById(
                "error"
            );


        error.textContent =
            message;


        error.style.display =
            "block";

    }


    /* ==============================
       BACK
    ============================== */

    function goBack() {

        window.location.href =
            "banker.html";

    }


    /* ==============================
       INIT
    ============================== */

    setToday();


</script>


</body>

</html>
