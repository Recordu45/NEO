<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050811"
    >

    <title>NEO | Notes Maker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .notes-page {
            width: min(1000px, 100%);
            margin: auto;
            padding: 25px 18px 110px;
        }

        .notes-header {
            padding: 30px 0;
        }

        .back-btn {
            border: 1px solid rgba(80,180,255,.18);
            background: rgba(13,21,38,.78);
            color: white;
            padding: 11px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .notes-header h1 {
            font-size: clamp(38px, 8vw, 62px);
            margin-top: 12px;
        }

        .notes-header h1 span {
            color: #28c7ff;
        }

        .notes-header p {
            color: #8e9bb2;
            line-height: 1.6;
            margin-top: 12px;
        }

        .editor-card {
            padding: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(18,31,54,.95),
                    rgba(8,13,25,.95)
                );

            border:
                1px solid
                rgba(80,180,255,.18);

            border-radius: 24px;

            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e5;
            font-size: 13px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid
                rgba(80,180,255,.18);

            border-radius: 12px;

            outline: none;

            background:
                rgba(0,0,0,.25);

            color: white;

            font-size: 14px;
        }

        .input-group textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.6;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #28c7ff;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 16px;

            border:
                1px solid
                rgba(80,180,255,.2);

            border-radius: 10px;

            background:
                rgba(40,199,255,.08);

            color: #28c7ff;

            cursor: pointer;
        }

        .btn.primary {
            background: #28c7ff;
            color: #00121a;
            border-color: #28c7ff;
            font-weight: 800;
        }

        .btn.danger {
            color: #ff8d8d;

            border-color:
                rgba(255,80,80,.2);
        }

        .notes-section {
            margin-top: 25px;
        }

        .notes-section h2 {
            margin-bottom: 15px;
        }

        .notes-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;
        }

        .note-card {
            padding: 20px;

            background:
                rgba(13,21,38,.78);

            border:
                1px solid
                rgba(80,180,255,.16);

            border-radius: 18px;

            cursor: pointer;

            transition: .2s;
        }

        .note-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(40,199,255,.45);
        }

        .note-card h3 {
            color: #28c7ff;
            word-break: break-word;
        }

        .note-preview {
            margin-top: 9px;

            color: #8e9bb2;

            font-size: 13px;

            line-height: 1.5;

            white-space: pre-wrap;

            display: -webkit-box;

            -webkit-line-clamp: 4;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .note-date {
            margin-top: 12px;

            color: #64748b;

            font-size: 10px;
        }

        .note-actions {
            display: flex;

            gap: 8px;

            margin-top: 13px;
        }

        .small-btn {
            padding: 7px 10px;

            border:
                1px solid
                rgba(80,180,255,.15);

            border-radius: 8px;

            background:
                rgba(255,255,255,.03);

            color: #8e9bb2;

            cursor: pointer;

            font-size: 11px;
        }

        .small-btn.delete {
            color: #ff8d8d;
        }

        .empty {
            padding: 35px 20px;

            text-align: center;

            color: #64748b;

            border:
                1px dashed
                rgba(80,180,255,.15);

            border-radius: 18px;

            grid-column: 1 / -1;
        }

        @media (max-width: 650px) {

            .notes-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="notes-page">


    <!-- HEADER -->

    <header class="notes-header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Student Mode
        </button>

        <span class="eyebrow">
            NEO STUDENT TOOL
        </span>

        <h1>
            Notes <span>Maker</span>
        </h1>

        <p>
            Create, save, edit and manage your
            study notes directly inside NEO.
        </p>

    </header>


    <!-- EDITOR -->

    <section class="editor-card">

        <div class="input-group">

            <label for="noteTitle">
                Note Title
            </label>

            <input
                id="noteTitle"
                type="text"
                placeholder="Example: Indian History Chapter 1"
            >

        </div>


        <div class="input-group">

            <label for="noteContent">
                Note Content
            </label>

            <textarea
                id="noteContent"
                placeholder="Write your notes here..."
            ></textarea>

        </div>


        <div class="actions">

            <button
                class="btn primary"
                onclick="saveNote()"
            >
                Save Note
            </button>

            <button
                class="btn"
                onclick="clearEditor()"
            >
                New Note
            </button>

        </div>

    </section>


    <!-- SAVED NOTES -->

    <section class="notes-section">

        <h2>
            My Notes
        </h2>


        <div
            id="notesGrid"
            class="notes-grid"
        ></div>

    </section>


</div>


<script>


    const STORAGE_KEY =
        "neo_student_notes";


    let editingId =
        null;


    /* ==============================
       LOAD NOTES
    ============================== */

    function getNotes() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                )
            ) || [];

        } catch {

            return [];

        }

    }


    /* ==============================
       SAVE NOTES
    ============================== */

    function saveNotes(notes) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(notes)
        );

    }


    /* ==============================
       SAVE NOTE
    ============================== */

    function saveNote() {

        const title =
            document.getElementById(
                "noteTitle"
            ).value.trim();


        const content =
            document.getElementById(
                "noteContent"
            ).value.trim();


        if (!title) {

            alert(
                "Please enter a note title."
            );

            return;

        }


        if (!content) {

            alert(
                "Please enter note content."
            );

            return;

        }


        const notes =
            getNotes();


        if (editingId) {

            const index =
                notes.findIndex(
                    note =>
                        note.id ===
                        editingId
                );


            if (index !== -1) {

                notes[index].title =
                    title;

                notes[index].content =
                    content;

                notes[index].updatedAt =
                    new Date().toISOString();

            }

            editingId =
                null;

        } else {

            notes.unshift({

                id:
                    Date.now()
                    .toString(),

                title:
                    title,

                content:
                    content,

                createdAt:
                    new Date().toISOString(),

                updatedAt:
                    new Date().toISOString()

            });

        }


        saveNotes(notes);

        clearEditor();

        renderNotes();

        alert(
            "Note saved successfully."
        );

    }


    /* ==============================
       RENDER NOTES
    ============================== */

    function renderNotes() {

        const notes =
            getNotes();


        const grid =
            document.getElementById(
                "notesGrid"
            );


        if (!notes.length) {

            grid.innerHTML = `

                <div class="empty">

                    No notes saved yet.

                    <br><br>

                    Create your first study note above.

                </div>

            `;

            return;

        }


        grid.innerHTML =
            notes.map(
                note => `

                    <article
                        class="note-card"
                    >

                        <h3>
                            ${escapeHTML(
                                note.title
                            )}
                        </h3>

                        <div
                            class="note-preview"
                        >
                            ${escapeHTML(
                                note.content
                            )}
                        </div>

                        <div
                            class="note-date"
                        >
                            ${formatDate(
                                note.updatedAt
                            )}
                        </div>

                        <div
                            class="note-actions"
                        >

                            <button
                                class="small-btn"
                                onclick="editNote('${note.id}')"
                            >
                                Edit
                            </button>

                            <button
                                class="small-btn delete"
                                onclick="deleteNote('${note.id}')"
                            >
                                Delete
                            </button>

                        </div>

                    </article>

                `
            )
            .join("");

    }


    /* ==============================
       EDIT NOTE
    ============================== */

    function editNote(id) {

        const notes =
            getNotes();


        const note =
            notes.find(
                item =>
                    item.id === id
            );


        if (!note) {
            return;
        }


        document.getElementById(
            "noteTitle"
        ).value =
            note.title;


        document.getElementById(
            "noteContent"
        ).value =
            note.content;


        editingId =
            id;


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    /* ==============================
       DELETE NOTE
    ============================== */

    function deleteNote(id) {

        const confirmed =
            confirm(
                "Delete this note?"
            );


        if (!confirmed) {
            return;
        }


        const notes =
            getNotes()
            .filter(
                note =>
                    note.id !== id
            );


        saveNotes(notes);

        renderNotes();

    }


    /* ==============================
       CLEAR EDITOR
    ============================== */

    function clearEditor() {

        document.getElementById(
            "noteTitle"
        ).value = "";


        document.getElementById(
            "noteContent"
        ).value = "";


        editingId =
            null;

    }


    /* ==============================
       ESCAPE HTML
    ============================== */

    function escapeHTML(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }


    /* ==============================
       FORMAT DATE
    ============================== */

    function formatDate(dateString) {

        const date =
            new Date(
                dateString
            );


        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* ==============================
       BACK
    ============================== */

    function goBack() {

        window.location.href =
            "student.html";

    }


    /* ==============================
       INIT
    ============================== */

    renderNotes();


</script>


</body>

</html>
